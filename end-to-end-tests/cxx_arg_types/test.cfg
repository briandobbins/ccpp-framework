# Test definition read by ../gpu_residency/build.sh (TEST_DIR=<this dir>).
# A host-side C++ scheme (cxx_types) taking the argument types added for C++
# schemes: a logical scalar and a logical array, an optional array that is
# alternately present and absent, a derived type (through its generated
# descriptor) and an array the C++ scheme allocates.  A Fortran scheme
# (ftn_types_check) recomputes every result independently and fails the run
# on any mismatch.  cxx_types_gpu is the GPU-side counterpart (memory_space =
# device): optional array, logical array out and logical scalar out, with
# OpenACC / OpenMP kernels; GPU builds must match this test's CPU build.
SCHEMES=(cxx_types cxx_types_gpu ftn_types_check ftn_types_after)
HOST_METAS=(../gpu_residency/gpu_data.meta ../gpu_residency/main.meta)
HOST_SRCS=(../gpu_residency/gpu_data.F90)
SUITE=suite_cxx_arg_types.xml
DRIVER=../gpu_residency/main.F90
EXE=test_cxx_arg_types.x
