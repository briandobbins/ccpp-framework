# Test definition read by ../gpu_residency/build.sh (TEST_DIR=<this dir>).
# The gpu_residency test with its two CPU schemes replaced by C++ schemes
# (same arithmetic) plus one GPU-ported C++ scheme (cxx_micro, OpenACC /
# OpenMP).  GPU builds must match this test's own CPU build.
SCHEMES=(../gpu_residency/gpu_heat cxx_adjust ../gpu_residency/gpu_moist ../gpu_residency/gpu_finish cxx_micro cxx_check)
HOST_METAS=(../gpu_residency/gpu_data.meta ../gpu_residency/main.meta)
HOST_SRCS=(../gpu_residency/gpu_data.F90)
SUITE=suite_cxx_schemes.xml
DRIVER=../gpu_residency/main.F90
EXE=test_cxx_schemes.x
